[project]
name = "dt-dsl"
version = "0.1.0"
description = "Desafío Técnico Data Scientist Lead - Optimización Logística y Corrección de Demanda"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "ipykernel>=6.29.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "reportlab>=4.1.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "uvicorn>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
